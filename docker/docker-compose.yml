name: hr-assessment

# Source is bind-mounted so `docker compose run --rm api pytest ...` always sees the
# working tree. Remove the `..:/app` volume lines for an image-only deployment.
x-app: &app
  build:
    context: ..
    dockerfile: docker/Dockerfile
    args:
      INSTALL_CLAUDE_CLI: ${INSTALL_CLAUDE_CLI:-false}
  image: hr-assessment-backend:local
  env_file:
    - path: ../.env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/hr_assessment
    TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@test-db:5432/hr_assessment_test
  volumes:
    - ..:/app

services:
  api:
    <<: *app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      test-db:
        condition: service_healthy

  worker:
    <<: *app
    command: ["python", "-m", "app.jobs.scheduler"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: hr_assessment
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_assessment"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Disposable database for the test suite: data lives in RAM and is lost on stop.
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hr_assessment_test
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hr_assessment_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  # --- dev profile: `docker compose --profile dev up` ---
  minio:
    profiles: ["dev"]
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"

  mailpit:
    profiles: ["dev"]
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
  minio_data:
