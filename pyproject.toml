[project]
name = "hr-assessment-backend"
version = "0.1.0"
description = "Multi-tenant proctored HR assessment backend"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs", "migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S101"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"app/**/router.py" = ["B008"]
"app/core/deps.py" = ["B008"]
